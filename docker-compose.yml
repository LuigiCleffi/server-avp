services:
  db:
    image: bitnami/postgresql:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: avp
      POSTGRES_PASSWORD: avp_psw!
      POSTGRES_DB: avp_db
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    profiles: ['prod']
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://avp:avp_psw!@db:5432/avp_db?schema=public
      JWT_SECRET: change-me
    ports:
      - '3000:3000'
    depends_on:
      - db

volumes:
  db_data:

