on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      ECR_REGISTRY:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  deploy:
    name: Build and push backend image
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment}}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable docker buildx plugin
        uses: docker/setup-buildx-action@v3

      # ✅ PROFESSIONAL WAY
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::ACCOUNT-ID:role/GitHubActionsRole
          role-session-name: GitHubActions
          aws-region: ${{ vars.AWS_REGION }}

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate into Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Export IMAGE_URI env
        run: |
          IMAGE_TAG=${GITHUB_RUN_ID}
          IMAGE_URI=${{ secrets.ECR_REGISTRY }}:$IMAGE_TAG
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_URI }},${{ secrets.ECR_REGISTRY }}:latest
          platforms: linux/arm64

      - name: Execute SSM playbook to deploy app
        run: |
          aws ssm send-command \
            --document-name "${{ vars.SSM_DOCUMENT_NAME }}" \
            --comment "Deploy backend. Env: ${{ inputs.environment}}. Image: ${GITHUB_RUN_ID}" \
            --parameters "application=backend,containerNameSuffix=${{ inputs.environment}}-${GITHUB_RUN_ID},imageUri=${{ env.IMAGE_URI }}" \
            --targets Key=tag:environment,Values=${{ inputs.environment}} Key=tag:stack,Values=application \
            --region ${{ vars.AWS_REGION }}
