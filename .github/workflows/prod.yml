name: Deploy Prod

on:
  push:
    branches:
      - main

jobs:
  ci-prod:
    name: build and deploy prod image
    uses: ./.github/workflows/pipeline.yml
    with:
      environment: "prod"
    secrets:
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY_PROD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    permissions:
      id-token: write
      contents: read
